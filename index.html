<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CRM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="crm-header">
        <h1>CRM</h1>
    </header>

    <main class="crm-content">
        <div id="client-list" class="client-list"></div>
        <button id="add-client-btn" class="add-client-button">Добавить клиента</button>
    </main>

    <div id="add-client-form" class="modal hidden">
        <div class="modal-content">
            <h2>Новый клиент</h2>
            <label>Имя:</label>
            <input type="text" id="client-name" placeholder="Введите имя">
            <label>Телефон:</label>
            <input type="text" id="client-phone" placeholder="+7...">
            <div class="modal-buttons">
                <button id="save-client-btn">Сохранить</button>
                <button id="cancel-client-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
